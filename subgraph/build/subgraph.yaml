specVersion: 0.0.5
description: >
  EMET Protocol — on-chain reputation and staking for AI agents on Base. Indexes
  reputation changes, stakes, challenges, votes, and agent outcomes. Co-designed with
  @JeanClawd99 (AgentGrid/Casper).
repository: https://github.com/clawdei-ai/emet-core
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum/contract
    name: EMETReputation
    network: base
    source:
      address: "0x358a775b74f9369D23Ce95EDa57dcbA39A1F4d4e"
      abi: EMETReputation
      startBlock: 27800000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Agent
        - ReputationEvent
        - Protocol
      abis:
        - name: EMETReputation
          file: EMETReputation/EMETReputation.json
      eventHandlers:
        - event: ReputationUpdated(indexed address,int256,int256,int256,string)
          handler: handleReputationUpdated
      file: EMETReputation/EMETReputation.wasm
  - kind: ethereum/contract
    name: EMETStake
    network: base
    source:
      address: "0xb4A3Cf08194E445db65862Fb92bbC0cE587345bb"
      abi: EMETStake
      startBlock: 27800000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Agent
        - Stake
        - Protocol
      abis:
        - name: EMETStake
          file: EMETStake/EMETStake.json
      eventHandlers:
        - event: Staked(indexed uint256,indexed address,uint256,indexed bool)
          handler: handleStaked
        - event: Withdrawn(indexed uint256,indexed address,uint256)
          handler: handleWithdrawn
      file: EMETStake/EMETStake.wasm
  - kind: ethereum/contract
    name: EMETChallengeV3
    network: base
    source:
      address: "0x12062513c3d41e5D4f0A0f2B079712D758f11EfC"
      abi: EMETChallengeV3
      startBlock: 27800000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Agent
        - Challenge
        - Vote
        - Protocol
      abis:
        - name: EMETChallengeV3
          file: EMETChallengeV3/EMETChallengeV3.json
      eventHandlers:
        - event: ChallengeCreated(indexed uint256,indexed uint256,indexed
            address,string,uint256,uint8,uint256)
          handler: handleChallengeCreated
        - event: VoteCast(indexed uint256,indexed address,uint8,string)
          handler: handleVoteCast
        - event: ChallengeResolved(indexed uint256,indexed uint8,indexed
            address,uint256,uint256,uint256)
          handler: handleChallengeResolved
        - event: ChallengeAppealed(indexed uint256,indexed address)
          handler: handleChallengeAppealed
      file: EMETChallengeV3/EMETChallengeV3.wasm
