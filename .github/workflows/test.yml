name: EMET Core — Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        working-directory: core
        run: npm ci || npm install

      - name: Run tests
        working-directory: core
        run: npm test -- --ci --verbose

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install core dependencies
        working-directory: core
        run: npm ci || npm install

      - name: Install API dependencies
        working-directory: api
        run: npm ci || npm install

      - name: Install test dependencies
        working-directory: tests
        run: npm ci || npm install

      - name: Start API server
        working-directory: api
        run: |
          node server.js &
          echo $! > /tmp/api.pid
          # Wait for API to be ready
          for i in {1..30}; do
            if curl -s http://localhost:3141/ > /dev/null 2>&1; then
              echo "API is ready"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 1
          done

      - name: Run integration tests
        working-directory: tests
        run: npm run test:ci

      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/api.pid ]; then
            kill $(cat /tmp/api.pid) 2>/dev/null || true
          fi

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t emet-core:test .

      - name: Test Docker image starts
        run: |
          docker run -d --name emet-test -p 3141:3141 emet-core:test
          sleep 5
          curl -f http://localhost:3141/ || exit 1
          docker logs emet-test
          docker stop emet-test

      - name: Test CLI in Docker
        run: |
          docker run --rm emet-core:test emet --version
          docker run --rm emet-core:test emet --help

  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON schemas parse correctly
        run: |
          echo "::group::Validating JSON files"
          errors=0
          for f in $(find . -name '*.json' -not -path './.git/*' -not -path './core/node_modules/*' -not -path './api/node_modules/*' -not -path './cli/node_modules/*' -not -path './proofs/node_modules/*' -not -path './tests/node_modules/*'); do
            if node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" 2>/dev/null; then
              echo "✓ $f"
            else
              echo "✗ $f — invalid JSON"
              errors=$((errors + 1))
            fi
          done
          echo "::endgroup::"
          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors JSON file(s) failed validation"
            exit 1
          fi
          echo "All JSON files valid ✓"
